name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Square.slnx
      - name: Build
        run: dotnet build Square.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Square.slnx -c Release --no-build

  pack-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Square.slnx
      - name: Pack
        run: dotnet pack Square.slnx -c Release --no-restore -o artifacts/packages -p:ContinuousIntegrationBuild=true
      - name: Restore package consumer
        run: dotnet restore tests/Square.PackageConsumer/Square.PackageConsumer.csproj --source artifacts/packages --source https://api.nuget.org/v3/index.json
      - name: Build package consumer
        run: dotnet build tests/Square.PackageConsumer/Square.PackageConsumer.csproj -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: square-packages
          path: artifacts/packages/*.*nupkg

  aot-smoke:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: Win32
          - os: ubuntu-latest
            rid: linux-x64
            platform: X11
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish NativeAOT sample
        run: dotnet publish samples/Square.Sample/Square.Sample.csproj -c Release -r ${{ matrix.rid }} -p:SquareTargetPlatform=${{ matrix.platform }} -p:SquareSamplePublishAot=true -p:SquareSampleUseVulkan=false -p:SquareSampleUseDevTools=false --self-contained true
