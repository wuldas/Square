name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: ${{ matrix.platform }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: Win32
            rid: win-x64
            executable: Square.Sample.exe
          - os: ubuntu-24.04
            platform: X11
            rid: linux-x64
            executable: Square.Sample
          - os: macos-15-intel
            platform: MacOS
            rid: osx-x64
            executable: Square.Sample

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'Square.slnx', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Square.slnx -p:SquareTargetPlatform=${{ matrix.platform }}

      - name: Build
        run: dotnet build Square.slnx --configuration Release --no-restore -p:SquareTargetPlatform=${{ matrix.platform }}

      - name: Install Linux test and NativeAOT dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libx11-6 libxrandr2 xvfb fonts-noto-cjk

      - name: Test
        run: dotnet test Square.slnx --configuration Release --no-build --no-restore -p:SquareTargetPlatform=${{ matrix.platform }} --filter "Category!=ChromiumIntegration"

      - name: Restore font conformance tool
        if: runner.os == 'Windows'
        run: dotnet restore tools/Square.FontComparison/Square.FontComparison.csproj -p:SquareTargetPlatform=Win32

      - name: Build font conformance tool
        if: runner.os == 'Windows'
        run: dotnet build tools/Square.FontComparison/Square.FontComparison.csproj --configuration Release --no-restore -p:SquareTargetPlatform=Win32

      - name: Install pinned Chromium
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/Square.FontComparison/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Chromium integration tests
        if: runner.os == 'Windows'
        run: dotnet test tests/Square.UI.Tests/Square.UI.Tests.csproj --configuration Release --no-build --no-restore -p:SquareTargetPlatform=Win32 --filter "Category=ChromiumIntegration"

      - name: Chromium font conformance
        if: runner.os == 'Windows'
        run: dotnet run --project tools/Square.FontComparison/Square.FontComparison.csproj --configuration Release --no-build --no-restore -p:SquareTargetPlatform=Win32 -- compare --backends Software,Skia --output artifacts/font-comparison

      - name: Upload font conformance report
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: font-conformance-windows
          path: artifacts/font-comparison
          if-no-files-found: warn

      - name: Chromium control conformance
        if: runner.os == 'Windows'
        run: dotnet run --project tools/Square.FontComparison/Square.FontComparison.csproj --configuration Release --no-build --no-restore -p:SquareTargetPlatform=Win32 -- compare-controls --backends Software,Skia --output artifacts/control-comparison

      - name: Upload control conformance report
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-conformance-windows
          path: artifacts/control-comparison
          if-no-files-found: warn

      - name: NativeAOT publish
        run: dotnet publish samples/Square.Sample/Square.Sample.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:SquareTargetPlatform=${{ matrix.platform }} -p:SquareSamplePublishAot=true -o artifacts/nativeaot

      - name: NativeAOT startup and screenshot regression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Force "artifacts/screenshots" | Out-Null
          $process = Start-Process -FilePath ".\artifacts\nativeaot\${{ matrix.executable }}" -ArgumentList "--circle-regression", "--verify-circle-regression", "--screenshot", "artifacts/screenshots/win32.png" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NativeAOT sample exited with code $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath "artifacts/screenshots/win32.png") -or (Get-Item -LiteralPath "artifacts/screenshots/win32.png").Length -eq 0) { throw "Screenshot was not created." }

      - name: NativeAOT startup and screenshot regression (X11)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/screenshots
          xvfb-run -a ./artifacts/nativeaot/${{ matrix.executable }} --circle-regression --verify-circle-regression --screenshot artifacts/screenshots/x11.png
          test -s artifacts/screenshots/x11.png

      - name: NativeAOT startup and screenshot regression (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/screenshots
          ./artifacts/nativeaot/${{ matrix.executable }} --circle-regression --verify-circle-regression --screenshot artifacts/screenshots/macos.png
          test -s artifacts/screenshots/macos.png

  tooling:
    name: IDE tooling (Windows)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tooling/square-language/package-lock.json
            tooling/vscode-square/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-tooling-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', 'tools/Square.LanguageServer/*.csproj', 'tests/Square.LanguageServer.Tests/*.csproj', 'tooling/visualstudio-square/*.csproj') }}
          restore-keys: nuget-tooling-${{ runner.os }}-

      - name: Restore Language Server tests
        run: dotnet restore tests/Square.LanguageServer.Tests/Square.LanguageServer.Tests.csproj -p:SquareTargetPlatform=Win32

      - name: Test Language Server
        run: dotnet test tests/Square.LanguageServer.Tests/Square.LanguageServer.Tests.csproj --configuration Release --no-restore -p:SquareTargetPlatform=Win32

      - name: Install VS Code extension dependencies
        working-directory: tooling/vscode-square
        run: npm ci

      - name: Prepare artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Package VS Code extension
        working-directory: tooling/vscode-square
        run: npm run package

      - name: Install shared grammar test dependencies
        working-directory: tooling/square-language
        run: npm ci

      - name: Verify shared grammar and host packages
        working-directory: tooling/square-language
        run: npm test

      - name: Build Visual Studio extension
        working-directory: tooling/visualstudio-square
        run: dotnet build Square.VisualStudio.csproj --configuration Release -p:SquareTargetPlatform=Win32

      - name: Verify Visual Studio extension archive
        working-directory: tooling/visualstudio-square
        run: node verify-vsix.mjs bin/Release/Square.LanguageSupport.VisualStudio.vsix

      - name: Build Rider plugin
        working-directory: tooling/rider-square
        run: .\gradlew.bat buildPlugin --no-daemon
